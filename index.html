<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GC Wise</title>
<style>
:root{--bg:#0d2b4b;--card:#12365a;--card2:#1a4573;--line:#2f6291;--tx:#ffffff;--mut:#9dbbd8;--org:#4aa3d9;--grn:#34c47c;--amb:#f2b632;--red:#ef5d5d;--blu:#8fd0f5}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding-bottom:84px}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
header{padding:16px 0 10px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:.2px}
.logo img{width:40px;height:40px;border-radius:10px;display:block}
.hero{display:block;width:170px;height:170px;border-radius:24px;margin:6px auto 4px}
.logo span{color:var(--org)}
.pill{font-size:11px;padding:4px 9px;border-radius:99px;background:var(--card2);color:var(--mut)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);margin:18px 0 8px;font-weight:700}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{background:var(--card);border:1px solid transparent;border-radius:12px;padding:8px 0;text-align:center;cursor:pointer}
.day small{display:block;font-size:10px;color:var(--mut);text-transform:uppercase}
.day b{font-size:17px;display:block;margin:2px 0}
.day.sel{border-color:var(--org);background:var(--card2)}
.day.today b{color:var(--org)}
.dots{display:flex;gap:3px;justify-content:center;height:6px}
.dots u{width:5px;height:5px;border-radius:50%;background:var(--blu);display:block}
.dots u.p{background:var(--amb)}.dots u.d{background:var(--red)}
.nav{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px}
.nav b{font-size:16px}
.nav button,.btn{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer}
.btn.pri{background:var(--org);color:#06203a;border-color:var(--org);font-weight:700}
.btn.sm{padding:6px 10px;font-size:12px}
.card{background:var(--card);border-radius:14px;padding:13px;margin-bottom:10px;border-left:4px solid var(--blu)}
.card.confirmed{border-color:var(--grn)}.card.pending{border-color:var(--amb)}.card.declined{border-color:var(--red)}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.t{font-weight:700;font-size:15px}
.s{font-size:12px;color:var(--mut);margin-top:2px}
.chip{font-size:11px;padding:3px 8px;border-radius:99px;font-weight:700;white-space:nowrap}
.chip.g{background:#12382a;color:var(--grn)}.chip.a{background:#3e3212;color:var(--amb)}.chip.r{background:#41191c;color:var(--red)}.chip.b{background:#16304f;color:var(--blu)}
.acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.empty{color:var(--mut);text-align:center;padding:26px 0;font-size:14px}
.gantt{background:var(--card);border-radius:14px;padding:10px;overflow-x:auto}
.grow{display:grid;grid-template-columns:96px repeat(14,22px);align-items:center;height:26px;font-size:11px}
.grow .nm{color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:6px}
.gh{color:var(--mut);text-align:center;font-size:9px}
.bar{height:14px;border-radius:5px;background:var(--blu)}
.bar.confirmed{background:var(--grn)}.bar.pending{background:var(--amb)}.bar.declined{background:var(--red)}
.sc{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
input,select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px;font-size:14px;margin-bottom:8px}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#0a2340;border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 0 10px}
.tabs div{display:flex;width:100%;max-width:560px}
.tabs button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;padding:6px;cursor:pointer;position:relative}
.tabs button svg{display:block;width:24px;height:24px;margin:0 auto 3px}
.tabs button.on{color:var(--org)}
.badge{position:absolute;top:0;right:28%;background:var(--red);color:#fff;border-radius:99px;font-size:10px;padding:1px 6px;font-weight:700}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--tx);color:#0f1b2d;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;max-width:92%;text-align:center;z-index:9}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(5,10,20,.7);display:none;align-items:flex-end;justify-content:center;z-index:8}
.modal.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px;max-height:88vh;overflow:auto}
.sheet h3{margin-bottom:12px}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:3px}
.alert{display:flex;gap:10px;background:var(--card);border-radius:14px;padding:12px;margin-bottom:9px}
.alert .ic{font-size:22px}
.note{font-size:12px;color:var(--mut);text-align:center;margin-top:18px;line-height:1.5}

.jobc{background:var(--card);border-radius:16px;padding:15px;margin-bottom:11px;cursor:pointer;border:1px solid var(--line)}
.jobc:active{background:var(--card2)}
.pg{height:7px;background:var(--bg);border-radius:9px;margin:10px 0 8px;overflow:hidden}
.pg div{height:100%;background:var(--org);border-radius:9px}
.jc{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.jobchip{display:inline-flex;gap:6px;align-items:center;background:var(--card2);border:1px solid var(--org);color:var(--tx);border-radius:99px;padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer;margin-top:4px}
textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:11px;font-size:15px;min-height:96px;font-family:inherit;resize:vertical;margin-bottom:8px}
.tg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tg button{background:var(--card2);border:1px solid var(--line);color:var(--mut);border-radius:99px;padding:6px 11px;font-size:12px;cursor:pointer}
.tg button.on{background:var(--org);color:#06203a;border-color:var(--org);font-weight:700}
.nt{background:var(--card);border-radius:12px;padding:11px 13px;margin-bottom:8px}
.nt p{font-size:14px;line-height:1.45;margin:5px 0 6px;white-space:pre-wrap}
.nt .x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:16px}
.bk{background:none;border:0;color:var(--org);font-size:13px;font-weight:700;cursor:pointer;padding:4px 0}

.phone{background:#000;border:2px solid var(--line);border-radius:26px;padding:12px 12px 14px;margin:4px 0 12px}
.phone .hd{text-align:center;font-size:12px;color:var(--mut);padding-bottom:10px;border-bottom:1px solid #222;margin-bottom:12px}
.phone .hd b{display:block;color:var(--tx);font-size:14px}
.sms{background:#2a2d33;border-radius:18px 18px 18px 4px;padding:11px 13px;font-size:14px;line-height:1.45;max-width:92%;white-space:pre-wrap}
.sms u{color:var(--blu)}
.dl{font-size:11px;color:var(--mut);margin:5px 0 0 6px}
.i{width:1.15em;height:1.15em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.alert .ic .i{width:22px;height:22px}
.pills{display:flex;gap:6px;overflow-x:auto;margin:10px 0 4px;padding-bottom:2px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill2{flex:none;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:99px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;-webkit-appearance:none;appearance:none}
.pill2.on{background:var(--org);color:#06203a;border-color:var(--org)}
</style>
</head>

function addPhotos(inp){var fs=[].slice.call(inp.files);inp.value='';fs.forEach(function(f){readPhoto(f,function(src){photos.unshift({id:nextId++,job:cur,src:src,t:Date.now(),tag:phTag==='All'?'Progress':phTag,cap:'',shared:false});savePhotos();render()})})}
function rPhotos(){
  if(!cur)return needJob('photos');
  var all=photos.filter(function(p){return p.job===cur}),list=all.filter(function(p){return phTag==='All'||p.tag===phTag});
  var h='<div class="nav"><b>'+all.length+' photo'+(all.length===1?'':'s')+'</b><label class="btn pri" style="cursor:pointer">+ Add photos<input type="file" accept="image/*" multiple style="display:none" onchange="addPhotos(this)"></label></div>';
  h+='<div class="tg">'+['All'].concat(PTAGS).map(function(t){return'<button class="'+(phTag===t?'on':'')+'" onclick="phTag=\''+t+'\';render()">'+t+'</button>'}).join('')+'</div>';
  if(!list.length)return h+'<div class="empty">'+(all.length?'No photos with that tag.':'No photos yet. Tap Add photos to take or pick pictures. They are saved to this job by date.')+'</div>';
  var days=[];list.forEach(function(p){var k=dk(new Date(p.t)),g=days.filter(function(d){return d.k===k})[0];if(!g){g={k:k,t:p.t,items:[]};days.push(g)}g.items.push(p)});
  days.forEach(function(g){h+='<h2>'+fmt(new Date(g.t))+'</h2><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px">'+g.items.map(function(p){return'<div style="position:relative;cursor:pointer" onclick="openPhoto('+p.id+')"><img src="'+p.src+'" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block" alt="'+esc(p.cap||p.tag)+'">'+(p.shared?'<span class="chip g" style="position:absolute;right:5px;top:5px;padding:3px 5px">👁</span>':'')+'</div>'}).join('')+'</div>'});
  return h}
function openPhoto(id){var p=ph(id);if(!p)return;
  openM('<img src="'+p.src+'" style="width:100%;max-height:50vh;object-fit:contain;border-radius:12px;background:#000;margin-bottom:10px" alt=""><div class="s" style="margin-bottom:8px">'+fmt(new Date(p.t))+' · '+esc(p.job)+'</div><input placeholder="Add a caption" value="'+esc(p.cap)+'" oninput="ph('+id+').cap=this.value;savePhotos()"><select onchange="ph('+id+').tag=this.value;savePhotos();render()">'+PTAGS.map(function(t){return'<option'+(t===p.tag?' selected':'')+'>'+t+'</option>'}).join('')+'</select><div class="acts"><button class="btn'+(p.shared?' pri':'')+'" onclick="sharePhoto('+id+')">👁 '+(p.shared?'Shared with client':'Share with client')+'</button><button class="btn" onclick="photoToPunch('+id+')">Add to punch list</button><button class="btn" onclick="delPhoto('+id+')">Delete</button></div><div class="acts"><button class="btn" style="width:100%" onclick="closeM();render()">Done</button></div>')}
function sharePhoto(id){var p=ph(id);p.shared=!p.shared;savePhotos();render();openPhoto(id)}
function photoToPunch(id){var p=ph(id);punch.unshift({id:nextId++,job:p.job,text:p.cap||'Fix needed (see photo)',room:'Other',sub:null,done:false,photo:id});p.tag='Punch list';savePunch();savePhotos();closeM();toast('Added to the punch list. Tap it to set the room.');render()}
function delPhoto(id){photos=photos.filter(function(x){return x.id!==id});punch.forEach(function(x){if(x.photo===id)x.photo=null});savePunch();savePhotos();closeM();render()}

function wk(n){weekStart=addD(weekStart,n);render()}
function pick(ms){sel=new Date(ms);render()}
function sendText(id){
  var t=tasks.filter(function(x){return x.id===id})[0],s=sub(t.sub);
  toast('Texted '+s.contact+': "Can you start '+t.title+' on '+fmt(t.start)+'? Reply 1 to confirm."');
  setTimeout(function(){t.status=(s.score<75&&Math.random()<.6)?'declined':'confirmed';toast(t.status==='confirmed'?s.contact+' replied: Confirmed':s.contact+' replied: Can’t make it');render()},2200)}
function slip(id,n){
  var moved=[],q=[id];
  while(q.length){var cur=q.shift();var t=tasks.filter(function(x){return x.id===cur})[0];t.start=addD(t.start,n);if(t.sub||t.dep)t.status=t.sub?'pending':t.status;moved.push(t.title);
    tasks.forEach(function(x){if(x.dep===cur)q.push(x.id)})}
  toast(moved.length>1?'Moved '+moved.length+' linked tasks +'+n+'d. Subs notified.':'Moved +'+n+'d. Sub notified.');render()}

function openM(h){document.getElementById('sheet').innerHTML=deemoji(h);document.getElementById('modal').className='modal show'}
function closeM(){document.getElementById('modal').className='modal'}
function addTask(){
  var opts='<option value="">Own crew / none</option>'+subs.map(function(s){return'<option value="'+s.id+'">'+esc(s.name)+' ('+esc(s.trade)+')</option>'}).join('');
  openM('<h3>New task</h3><label>Task</label><input id="nt" placeholder="e.g. Install cabinets"><label>Job</label><select id="nj">'+jobs.map(function(j){return'<option'+(j.name===cur?' selected':'')+'>'+esc(j.name)+'</option>'}).join('')+'</select><label>Sub</label><select id="ns">'+opts+'</select><label>Days</label><input id="nd" type="number" value="1" min="1"><div class="acts"><button class="btn pri" onclick="saveTask()">Add to '+fmt(sel)+'</button><button class="btn" onclick="closeM()">Cancel</button></div>')}
function saveTask(){
  var ti=document.getElementById('nt').value.trim();if(!ti){toast('Enter a task name');return}
  var sid=document.getElementById('ns').value;
  tasks.push({id:nextId++,job:document.getElementById('nj').value,title:ti,sub:sid?+sid:null,start:sel,days:Math.max(1,+document.getElementById('nd').value||1),status:sid?'pending':'confirmed',dep:null,ext:false,insp:false});
  closeM();toast('Task added');render()}
function iso(d){d=mid(d);var m=d.getMonth()+1,dd=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd}
function fromIso(v){if(!v)return null;var p=v.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addSub(){
  openM('<h3>New subcontractor</h3><label>Company or name</label><input id="sn"><label>Trade</label><input id="st" placeholder="e.g. Tile"><label>Phone</label><input id="sp" type="tel" placeholder="(850) 555-0000"><label>Contact name (optional)</label><input id="sc"><div class="acts"><button class="btn pri" style="flex:1" onclick="saveSub()">Save</button><button class="btn" onclick="closeM()">Cancel</button></div><div class="s" style="margin-top:14px;text-align:center">Adding a lot? <a href="#" style="color:var(--blu)" onclick="importSubs();return false">Import many at once</a></div>')}
function saveSub(){
  var n=document.getElementById('sn').value.trim();if(!n){toast('Enter a name');return}
  subs.push({id:nextId++,name:n,trade:document.getElementById('st').value.trim()||'General',contact:document.getElementById('sc').value.trim()||'—',phone:document.getElementById('sp').value.trim()||'—',score:null,ins:null});
  closeM();toast('Sub added');render()}
function importSubs(){
  var can=!!(navigator.contacts&&navigator.contacts.select);
  openM('<h3>Import subs</h3>'+(can?'<button class="btn pri" style="width:100%;padding:12px;margin-bottom:6px" onclick="importContacts()">Choose from phone contacts</button><div class="s" style="text-align:center;margin-bottom:12px">or paste a list below</div>':'<div class="s" style="margin-bottom:8px">Paste your list. One sub per line: name, trade, phone. Trade and phone are optional. You can paste straight from a spreadsheet.</div>')+'<textarea id="pl" style="min-height:130px" placeholder="Smith Framing, Framing, 850-555-0142&#10;Gulf Electric, Electrical, 850-555-0188"></textarea><div class="acts"><button class="btn pri" style="flex:1" onclick="savePaste()">Add subs</button><button class="btn" onclick="closeM()">Cancel</button></div>')}
function savePaste(){
  var n=0;document.getElementById('pl').value.split(/\n/).forEach(function(line){
    var m=line.match(/\(?\d{3}\)?[\s.\-]*\d{3}[\s.\-]*\d{4}/),ph=m?m[0].trim():'',
    f=(m?line.replace(m[0],''):line).split(/[,\t|]/).map(function(x){return x.trim()}).filter(Boolean);
    if(!f[0])return;
    subs.push({id:nextId++,name:f[0],trade:f[1]||'General',contact:'—',phone:ph||'—',score:null,ins:null});n++});
  if(!n){toast('Nothing to add yet');return}
  closeM();toast(n+' sub'+(n===1?'':'s')+' added. Tap one to fix its trade or add insurance.');render()}
function importContacts(){
  navigator.contacts.select(['name','tel'],{multiple:true}).then(function(l){
    var n=0;l.forEach(function(c){var nm=(c.name&&c.name[0])||'';if(!nm)return;subs.push({id:nextId++,name:nm,trade:'General',contact:'—',phone:(c.tel&&c.tel[0])||'—',score:null,ins:null});n++});
    closeM();toast(n+' imported. Tap a sub to set its trade.');render()}).catch(function(){toast('Contacts not available here. Paste a list instead.')})}
function editSub(id){
  var x=sub(id);
  openM('<h3>Edit sub</h3><label>Company or name</label><input id="en" value="'+esc(x.name)+'"><label>Trade</label><input id="et" value="'+esc(x.trade)+'"><label>Phone</label><input id="ep" type="tel" value="'+esc(x.phone)+'"><label>Contact name</label><input id="ec" value="'+esc(x.contact)+'"><label>Insurance expires</label><input id="ei" type="date" value="'+(x.ins?iso(x.ins):'')+'"><div class="acts"><button class="btn pri" style="flex:1" onclick="saveEdit('+id+')">Save</button><button class="btn" onclick="closeM()">Cancel</button></div>')}
function saveEdit(id){
  var x=sub(id),n=document.getElementById('en').value.trim();if(!n){toast('Enter a name');return}
  x.name=n;x.trade=document.getElementById('et').value.trim()||'General';x.phone=document.getElementById('ep').value.trim()||'—';x.contact=document.getElementById('ec').value.trim()||'—';x.ins=fromIso(document.getElementById('ei').value);
  closeM();toast('Saved');render()}
function assignSub(id){
  var t=tk(id),tr=t.trade.toLowerCase(),m=subs.filter(function(x){return x.trade.toLowerCase()===tr}),o=subs.filter(function(x){return m.indexOf(x)<0}),
  op=function(x){return'<option value="'+x.id+'">'+esc(x.name)+'</option>'};
  openM('<h3>Assign a sub</h3><div class="s" style="margin-bottom:10px">'+esc(t.title)+' · needs '+esc(t.trade)+'</div><select id="as"><option value="">Choose a sub</option>'+(m.length?'<optgroup label="'+esc(t.trade)+'">'+m.map(op).join('')+'</optgroup>':'')+(o.length?'<optgroup label="Other subs">'+o.map(op).join('')+'</optgroup>':'')+'</select><button class="btn pri" style="width:100%;margin-bottom:8px" onclick="doAssign('+id+')">Assign</button><h2>Not in your list yet?</h2><label>Name or company</label><input id="qn"><label>Phone</label><input id="qp" type="tel" placeholder="(850) 555-0000"><button class="btn" style="width:100%" onclick="quickAssign('+id+')">Add and assign</button>')}
function doAssign(id){var v=document.getElementById('as').value;if(!v){toast('Choose a sub');return}var t=tk(id);t.sub=+v;t.status='pending';closeM();toast('Assigned to '+sub(t.sub).name+'. Text them to confirm.');render()}
function quickAssign(id){
  var t=tk(id),n=document.getElementById('qn').value.trim();if(!n){toast('Enter a name');return}
  var x={id:nextId++,name:n,trade:t.trade,contact:'—',phone:document.getElementById('qp').value.trim()||'—',score:null,ins:null};subs.push(x);t.sub=x.id;t.status='pending';closeM();toast(n+' added and assigned.');render()}

 home:{name:'New home build',tasks:[

 kitchen:{name:'Kitchen remodel',tasks:[

 bath:{name:'Bathroom remodel',tasks:[

};
function buildJob(jobName,tpl,start){
  var T=TEMPLATES[tpl];if(!T)return 0;var made=[];
  T.tasks.forEach(function(r){
    var d=r[3]==null?mid(start):addD(made[r[3]].start,made[r[3]].days),insp=r[2]==='!insp',trade=(insp||!r[2])?null:r[2],
    m=trade?subs.filter(function(x){return x.trade.toLowerCase()===trade.toLowerCase()})[0]:null,
    t={id:nextId++,job:jobName,title:r[0],sub:m?m.id:null,trade:trade,start:d,days:r[1],status:(trade||insp)?'pending':'confirmed',dep:r[3]==null?null:made[r[3]].id,ext:!!r[4],insp:insp};
    made.push(t);tasks.push(t)});
  return made.length}
function addJob(){
  var o='<option value="">Start from scratch</option>'+Object.keys(TEMPLATES).map(function(k){return'<option value="'+k+'">'+esc(TEMPLATES[k].name)+' ('+TEMPLATES[k].tasks.length+' tasks)</option>'}).join('');
  openM('<h3>New job</h3><label>Job name</label><input id="jn" placeholder="e.g. Smith Bathroom Remodel"><label>Address</label><input id="ja"><label>Client name</label><input id="jc" placeholder="e.g. Tom and Beth"><label>Client email</label><input id="je" type="email" placeholder="client@email.com"><label>Template</label><select id="jt">'+o+'</select><label>Start date</label><input id="jd" type="date" value="'+iso(today)+'"><div class="s" style="margin:0 0 10px">A template fills in the whole task list in order. You just assign subs.</div><div class="acts"><button class="btn pri" style="flex:1" onclick="saveJob()">Create job</button><button class="btn" onclick="closeM()">Cancel</button></div>')}
function saveJob(){
  var n=document.getElementById('jn').value.trim();if(!n){toast('Enter a job name');return}
  var st=fromIso(document.getElementById('jd').value)||today,tp=document.getElementById('jt').value;
  jobs.push({name:n,addr:document.getElementById('ja').value.trim()||'No address yet',client:document.getElementById('jc').value.trim()||'there',email:document.getElementById('je').value.trim(),slug:n.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,14)+'-'+(1000+jobs.length*37)});
  var c=tp?buildJob(n,tp,st):0;closeM();
  if(c){cur=n;sel=mid(st);weekStart=addD(sel,-sel.getDay());toast('Job created with '+c+' tasks. Assign subs to get going.');go('sched')}else{toast('Job created');render()}}
render();
if(!gcName)askName();
